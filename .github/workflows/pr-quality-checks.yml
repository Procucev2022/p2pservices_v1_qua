name: PR Quality Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Needed so the job can post/update the summary comment on the pull request.
permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: pr-quality-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  COVERAGE_THRESHOLD: "90"
  # Deliberately not named MAVEN_ARGS: Maven 3.9+ picks that variable up
  # implicitly, which would apply the flags twice.
  MVN_FLAGS: "-B -ntp"

jobs:
  quality-checks:
    name: Lint, build, test and coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # ------------------------------------------------------------------
      # 1. Compile: this is the typecheck gate for Java.
      #    Checkstyle is bound to the validate phase in pom.xml, so it is
      #    skipped here and run once, explicitly, in the lint step.
      # ------------------------------------------------------------------
      - name: Compile (typecheck)
        id: compile
        continue-on-error: true
        run: mvn $MVN_FLAGS clean compile -DskipTests -Dcheckstyle.skip=true

      - name: Lint (Checkstyle)
        id: lint
        continue-on-error: true
        run: mvn $MVN_FLAGS checkstyle:check -Dcheckstyle.consoleOutput=false

      - name: Build (package)
        id: build
        continue-on-error: true
        run: mvn $MVN_FLAGS package -DskipTests -Dcheckstyle.skip=true

      # ------------------------------------------------------------------
      # 2. Tests + coverage.
      #    -Dmaven.test.failure.ignore=true lets every test run so the
      #    summary is complete instead of stopping at the first failure.
      #    jacoco:report is bound before jacoco:check in the test phase, so
      #    jacoco.xml is always written even when the coverage rule fails.
      #    The gate itself is evaluated from that XML in the next step.
      # ------------------------------------------------------------------
      - name: Run unit tests with coverage
        id: test
        continue-on-error: true
        run: |
          mvn $MVN_FLAGS test \
            -Dmaven.test.failure.ignore=true \
            -Dcheckstyle.skip=true

      - name: Verify coverage report exists
        id: verify-report
        run: |
          if [ -f target/site/jacoco/jacoco.xml ]; then
            echo "jacoco.xml found ($(wc -c < target/site/jacoco/jacoco.xml) bytes)"
          else
            echo "::warning::target/site/jacoco/jacoco.xml was not generated"
            echo "--- target/site contents ---"
            ls -R target/site 2>/dev/null || echo "target/site missing"
          fi
          if [ -d target/surefire-reports ]; then
            echo "surefire reports: $(ls target/surefire-reports/TEST-*.xml 2>/dev/null | wc -l)"
          else
            echo "::warning::target/surefire-reports was not generated"
          fi

      # ------------------------------------------------------------------
      # 3. Build the summary. Python parses the report XML directly, which
      #    avoids the grep/head guesswork that produced wrong numbers.
      # ------------------------------------------------------------------
      - name: Build quality summary
        id: report
        if: always()
        env:
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 .github/scripts/pr_quality_report.py \
            --surefire-dir target/surefire-reports \
            --jacoco-xml target/site/jacoco/jacoco.xml \
            --checkstyle-xml target/checkstyle-result.xml \
            --threshold "$COVERAGE_THRESHOLD" \
            --output pr-comment.md

      - name: Add summary to job page
        if: always()
        run: |
          if [ -f pr-comment.md ]; then
            cat pr-comment.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Quality summary could not be generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: |
            target/site/jacoco/
            pr-comment.md
          if-no-files-found: warn
          retention-days: 7

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7

      # ------------------------------------------------------------------
      # 4. Post (or update) the PR comment. Never fails the job: if the
      #    token is read-only, which is the case for pull requests opened
      #    from a fork, the summary is still on the job summary page.
      # ------------------------------------------------------------------
      - name: Comment quality summary on PR
        id: comment
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const file = 'pr-comment.md';

            if (!fs.existsSync(file)) {
              core.warning('pr-comment.md not found, nothing to post.');
              return;
            }

            const body = fs.readFileSync(file, 'utf8');
            const marker = '<!-- pr-quality-checks -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            try {
              const comments = await github.paginate(
                github.rest.issues.listComments,
                { owner, repo, issue_number, per_page: 100 }
              );
              const existing = comments.find(c => c.body && c.body.includes(marker));

              if (existing) {
                await github.rest.issues.updateComment({
                  owner, repo, comment_id: existing.id, body
                });
                core.info(`Updated existing quality comment ${existing.id}`);
              } else {
                const { data } = await github.rest.issues.createComment({
                  owner, repo, issue_number, body
                });
                core.info(`Created quality comment ${data.id}`);
              }
            } catch (error) {
              core.warning(
                `Could not post the PR comment (${error.status || 'no status'}: ${error.message}). ` +
                'The summary is available on the workflow run summary page. ' +
                'For pull requests from a fork GITHUB_TOKEN is read-only, and repository ' +
                'Settings > Actions > Workflow permissions must allow read and write access.'
              );
            }

      # ------------------------------------------------------------------
      # 5. Quality gate: fails the check run when any requirement is unmet.
      # ------------------------------------------------------------------
      - name: Quality gate
        if: always()
        env:
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TESTS_GATE: ${{ steps.report.outputs.tests_gate }}
          COVERAGE_GATE: ${{ steps.report.outputs.coverage_gate }}
          TESTS_TOTAL: ${{ steps.report.outputs.tests_total }}
          TESTS_PASSED: ${{ steps.report.outputs.tests_passed }}
          TESTS_FAILED: ${{ steps.report.outputs.tests_failed_total }}
          TESTS_SKIPPED: ${{ steps.report.outputs.tests_skipped }}
          FILES_BELOW: ${{ steps.report.outputs.files_below_threshold }}
          LINE_COVERAGE: ${{ steps.report.outputs.coverage_line }}
          BRANCH_COVERAGE: ${{ steps.report.outputs.coverage_branch }}
        run: |
          failed=0

          echo "Compile / typecheck : $COMPILE_OUTCOME"
          [ "$COMPILE_OUTCOME" = "success" ] || failed=1

          echo "Lint (Checkstyle)   : $LINT_OUTCOME"
          [ "$LINT_OUTCOME" = "success" ] || failed=1

          echo "Build (package)     : $BUILD_OUTCOME"
          [ "$BUILD_OUTCOME" = "success" ] || failed=1

          echo "Unit tests          : $TESTS_GATE (total=$TESTS_TOTAL passed=$TESTS_PASSED failed=$TESTS_FAILED skipped=$TESTS_SKIPPED)"
          [ "$TESTS_GATE" = "pass" ] || failed=1

          echo "Coverage >= ${COVERAGE_THRESHOLD}% per file : $COVERAGE_GATE (files below threshold=$FILES_BELOW, overall line=${LINE_COVERAGE}%, branch=${BRANCH_COVERAGE}%)"
          [ "$COVERAGE_GATE" = "pass" ] || failed=1

          if [ "$failed" -ne 0 ]; then
            echo "::error::Quality gate failed. See the PR comment or the job summary for details."
            exit 1
          fi
          echo "Quality gate passed."
