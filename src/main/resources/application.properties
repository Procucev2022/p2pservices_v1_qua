spring.profiles.active=dev
spring.application.name=procucev
spring.datasource.hikari.pool-name=procucev pool
spring.datasource.hikari.connection-timeout=30000
# open-in-view keeps a connection checked out for the whole request, so the pool size caps
# effective concurrency at that many in-flight requests. Declared explicitly below rather than
# left to the default, both to silence the warning Spring logs on every boot and to make the
# trade-off switchable without a code change.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:15}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
# Was 10000: idle connections were being reaped after 10s, forcing a fresh TCP+TLS
# handshake to Azure MySQL on almost every request burst.
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.jpa.hibernate.ddl-auto=none
# Left at true to preserve current behaviour: turning it off would surface
# LazyInitializationException anywhere a controller or serialiser still touches an uninitialised
# association. Flip JPA_OPEN_IN_VIEW to false once those paths are verified, to stop holding a
# pooled connection for the lifetime of each request.
spring.jpa.open-in-view=${JPA_OPEN_IN_VIEW:true}
# Never enable in a deployed environment: every statement is written synchronously to
# System.out, which serialises request threads on the console lock.
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
# Collapses residual lazy @ManyToOne/@OneToMany initialisations into batched IN (...) loads
# instead of one SELECT per parent row.
spring.jpa.properties.hibernate.default_batch_fetch_size=100
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5Dialect
# Dialect is deliberately not set. Hibernate resolves MySQLDialect from the JDBC connection
# metadata on its own, and naming it explicitly only produced a HHH90000025 warning on every
# boot. Set it again only if a future driver reports metadata Hibernate cannot map.
#spring.datasource.driver-class-name=com.mysql.jdbc.Driver
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5Dialect
#spring.jpa.database-platform=org.hibernate.dialect.MySQL5InnoDBDialect
spring.jackson.serialization.fail-on-empty-beans=false
