# Email-to-RFQ Automation Properties
app.mail.host=${EMAIL_HOST:imap.gmail.com}
app.mail.port=${EMAIL_PORT:993}
app.mail.username=${EMAIL_USERNAME:rfq@procucev.com}
# Empty default on purpose: a missing secret must not prevent the whole
# application context (and therefore /authenticate) from starting. The
# email-to-RFQ pipeline reports the missing credential when it runs instead.
app.mail.password=${EMAIL_PASSWORD:}
app.mail.inbox-folder=${EMAIL_INBOX_FOLDER:INBOX}
app.mail.processed-folder=${EMAIL_PROCESSED_FOLDER:Processed}
app.mail.error-folder=${EMAIL_ERROR_FOLDER:Error}
app.mail.attachment-directory=${EMAIL_ATTACHMENT_DIR:./attachments}
# IMAP socket timeouts. The read timeout covers downloading a message with its attachments, so it
# needs more headroom than a bare protocol exchange; 30s was being exceeded and surfaced as
# "BYE ... Read timed out" on both fetch and folder moves.
app.mail.connect-timeout-ms=${EMAIL_CONNECT_TIMEOUT_MS:15000}
app.mail.read-timeout-ms=${EMAIL_READ_TIMEOUT_MS:60000}
# A processed message that cannot be filed is left read but unfiled, so the move is retried.
app.mail.move-max-attempts=${EMAIL_MOVE_MAX_ATTEMPTS:3}
app.mail.move-retry-delay-ms=${EMAIL_MOVE_RETRY_DELAY_MS:2000}

